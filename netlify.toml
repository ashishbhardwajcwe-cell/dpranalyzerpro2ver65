[build]
  publish = "public"
  functions = "netlify/functions"

# analyze.js is the fast job orchestrator (validates, queues, fires
# the background function, returns job_id). 10 s is plenty.
[functions."analyze"]
  timeout = 10

# analyze-background.js uses the -background suffix, which Netlify
# automatically recognises as a Background Function (up to 15-minute
# runtime, response body discarded). No timeout setting needed here —
# Netlify ignores per-function timeouts for background functions.

# analyze-status.js is polled by the client every few seconds.
[functions."analyze-status"]
  timeout = 10

[functions."auth"]
  timeout = 10

[functions."usage"]
  timeout = 10

[functions."admin"]
  timeout = 10

[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "20"
