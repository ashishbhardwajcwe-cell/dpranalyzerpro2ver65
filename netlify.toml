[build]
  publish = "public"
  functions = "netlify/functions"

[functions."analyze"]
  timeout = 26

[functions."auth"]
  timeout = 10

[functions."usage"]
  timeout = 10

[functions."admin"]
  timeout = 10

[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "20"
